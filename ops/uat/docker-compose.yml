name: budget-uat-18

services:
  db:
    container_name: budget-uat-18-db
    image: public.ecr.aws/supabase/postgres:17.6.1.165@sha256:28f0e16a019e648089fc1a6d333549a55548f6019c15ae4bd7cd58b989027518
    restart: "no"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?missing JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    ports:
      - "127.0.0.1:54522:5432"
    volumes:
      - budget-uat-18-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 2s
      retries: 12
    networks:
      - budget-uat-18-net

  auth:
    container_name: budget-uat-18-auth
    image: public.ecr.aws/supabase/gotrue:v2.196.0@sha256:c0c25187a6b835e65a6f6e6c6b39d090e832d40e6de5186f2c038e0411944232
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:?missing API_EXTERNAL_URL}
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?missing JWT_SECRET}
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: ${GOTRUE_PASSWORD_MIN_LENGTH:-12}
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 0
      GOTRUE_SITE_URL: ${SITE_URL:?missing SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL:?missing SITE_URL}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 2s
      retries: 12
    networks:
      - budget-uat-18-net

  rest:
    container_name: budget-uat-18-rest
    image: public.ecr.aws/supabase/postgrest:v16.1@sha256:5922bde07147b82b1c9d8f749e48c1e5b99ebb233f3888bb7ab65f07cf4ac82d
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_JWT_SECRET: ${JWT_SECRET:?missing JWT_SECRET}
    healthcheck:
      test: ["CMD", "postgrest", "--version"]
      interval: 10s
      timeout: 2s
      retries: 6
    networks:
      - budget-uat-18-net

  kong:
    container_name: budget-uat-18-kong
    image: public.ecr.aws/supabase/kong:2.8.1@sha256:1b53405d8680a09d6f44494b7990bf7da2ea43f84a258c59717d4539abf09f6d
    restart: "no"
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors
    ports:
      - "127.0.0.1:54521:8000"
    volumes:
      - ./kong.yml:/home/kong/kong.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "kong health"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - budget-uat-18-net

networks:
  budget-uat-18-net:
    name: budget-uat-18-net

volumes:
  budget-uat-18-db-data:
    name: budget-uat-18-db-data
