_format_version: "2.1"
_transform: true

services:
  - name: budget-uat-auth
    url: http://auth:9999/
    routes:
      - name: budget-uat-auth-route
        strip_path: true
        paths:
          - /auth/v1/
  - name: budget-uat-rest
    url: http://rest:3000/
    routes:
      - name: budget-uat-rest-route
        strip_path: true
        paths:
          - /rest/v1/
